          \ въезде; парковка охраняемая для гостей кемпинга (включена в стоимость),\
          \ для гостей плота — 300 ₽/сутки.\n\nКУПАНИЕ И БЕЗОПАСНОСТЬ НА ВОДЕ:\n-\
          \ Купание — на оборудованном пляже с проверенным дном.\n- Дети на плоту\
          \ — только в спасжилетах; за безопасностью малышей присматривают родители,\
          \ это главное правило на воде.\n- Во время перехода плота — купание с борта\
