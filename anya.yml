          - Купание — только на оборудованном пляже с проверенным дном\n- За безопасностью\
          \ маленьких детей присматривают сами родители — это главное правило на воде\n\
          - Капитан опытный, всегда подскажет, где купаться безопасно\n\nЖивотные:\n\
          - Ручные и не агрессивные собаки — по согласованию при брони\n\nКонтакты\
          \ для брони плота:\n- Форма: https://rostur.expert/splav-po-dony-na-ploty/#zayavka\n\
          - Алексей (плоты): +7 (995) 032-00-02 (10:00–20:00)\n\n═══════════════════════════════════════════\n\
          ПРОДУКТ 2: КЕМПИНГ «ПАРК ВЕРТЯЧИЙ»\n═══════════════════════════════════════════\n\
          \nЧто это:\nОхраняемый кемпинг на берегу Дона, х. Вертячий, 50 км от Волгограда\
