          \ лучше не заходить.\n\nБАНЯ НА ПЛОТУ:\n- Топится в движении и на стоянке;\
          \ комфортно 4–6 человек за заход.\n\nКОРПОРАТИВЫ:\n- 50+ проведённых, до\
