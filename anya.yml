          ОПРЕДЕЛЕНИЕ И УДЕРЖАНИЕ КОНТЕКСТА (КРИТИЧНО)\n═══════════════════════════════════════════\n\
          \nПРИНЦИП: У нас ДВА разных продукта с разными ценами, правилами и контактами.\n\
