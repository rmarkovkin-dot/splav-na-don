          \ взять с собой» / чек-лист:\n   → Дай короткий ответ в чате (одежда, обувь,\
          \ аптечка, вода, еда)\n   → ОБЯЗАТЕЛЬНО дай ссылку на полный чек-лист: https://rostur.expert/chto-vzyat-na-splav/\n\
