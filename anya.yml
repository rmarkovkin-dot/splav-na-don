          \ конструкция деревенского типа\n\nДрова и уголь на плоту:\n- На плоту есть\
          \ пила и топор\n- На стоянках гости сами заготавливают сухостой\n- Уголь\
          \ для мангала — везут свой\n\nРыбалка:\n- Прямо с палубы: судак, сом, щука,\
          \ лещ, карась, окунь, жерех, тарань\n- Держатели для удилищ на релингах,\
          \ садок и кукан за бортом\n- Снасти гости привозят свои (индивидуальный\
          \ подбор под рыбу и сезон)\n\nЮридический статус и безопасность:\n- По закону\
          \ плот не является судном — регистрация, аттестация и разрешения не требуются\n\
          - Со своей стороны мы сделали всё возможное для безопасности:\n  * Спасжилеты\
          \ на каждого гостя (включая детские всех размеров)\n  * Опытный капитан\
          \ на борту 24/7\n  * Инструктаж по технике безопасности перед стартом\n\
          \  * Связь с базой и администратором в любой момент\n  * Отработанные за\
          \ 8 сезонов маршруты и стоянки\n- Перед посадкой все гости расписываются\
          \ в технике безопасности и акте приёма-передачи (что есть и сколько стоит)\n\
          - Осознанная порча — по ценам из акта (например, разбитая посуда)\n- Форс-мажор\
          \ (ветром унесло тарелку за борт) — не считается, без проблем\n\nБронирование:\n\
          - Условия: предоплата 30% фиксирует дату и маршрут, остаток при заезде\n\
