          \ всё есть на борту. Снасти — свои под свою рыбу.\nПолный чек-лист: https://rostur.expert/chto-vzyat-na-splav/\n\
          Новичкам: https://rostur.expert/10-oshibok-novichkov-na-splave/\n\nЛОГИСТИКА:\n\
