          \nЦены (включено в стоимость):\n- Пеший турист (дневное пребывание, БЕЗ\
          \ палатки и ночёвки): 250 ₽/чел/день\n- Машина, 2-я линия (в тени леса,\
          \ ~25 м от воды): 1 000 ₽/сутки за машину (1–5 человек, цена не меняется).\
          \ Палатка и ночёвка. Удобно семьям с детьми: тень и тишина, до рыбалки недалеко.\n\
          - Машина, 1-я линия (у самой воды + тень деревьев): 1 000 ₽/сутки за машину\
